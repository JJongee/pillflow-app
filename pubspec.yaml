name: pillflow
description: 필플로우(Pill-Flow) - DUR 기반 복약 관리 앱 (PBL 4인 과제)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  speech_to_text: ^7.5.0
  shared_preferences: ^2.5.6
  image_picker: ^1.2.4
  google_mlkit_text_recognition: ^0.17.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/mock/
